spring:
  application:
    name: ronda-backend
  web:
    error:
      include-message: never
      include-stacktrace: never
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:ronda}}
    username: ${DB_USER:ronda}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ronda
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: ronda
    schemas: ronda
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  ofertas:
    # Plazo de vigencia de cada oferta/contraoferta. 2880 minutos = 48 horas.
    vigencia-minutos: ${OFERTAS_VIGENCIA_MINUTOS:2880}
    # Cada cuanto se revisan las ofertas vencidas (milisegundos).
    revision-vencimiento-ms: ${OFERTAS_REVISION_MS:60000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:600}
    sender: ${OTP_SENDER:no-reply@ronda.local}
  security:
    jwt:
      # Solo desarrollo. En entornos compartidos definir JWT_SECRET (minimo 32 bytes).
      secret: ${JWT_SECRET:local-ronda-jwt-secret-change-me-32bytes}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
