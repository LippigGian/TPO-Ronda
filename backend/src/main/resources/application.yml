spring:
  application:
    name: ronda-backend
  web:
    error:
      include-message: never
      include-stacktrace: never
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:ronda}}
    username: ${DB_USER:ronda}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ronda
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: ronda
    schemas: ronda
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
